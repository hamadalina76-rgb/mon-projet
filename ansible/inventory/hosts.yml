all:
  children:
    # Chaque groupe correspond à un environnement Terraform.
    # Le --limit Ansible doit cibler l'un de ces groupes pour éviter un déploiement
    # involontaire sur plusieurs VMs.
    dev:
      hosts:
        data-services-dev:
          ansible_host: 10.10.0.10
          ansible_user: debian
          gcp_zone: europe-west1-b
          gcp_project: speedline-dev-488413
    staging:
      hosts:
        data-services-staging:
          ansible_host: 10.20.0.10
          ansible_user: debian
          gcp_zone: europe-west1-b
          gcp_project: speedline-staging-xxxxxx
    prod:
      hosts:
        data-services-prod:
          ansible_host: 10.30.0.10
          ansible_user: debian
          gcp_zone: europe-west1-b
          gcp_project: speedline-prod-xxxxxx

# Notes:
# - For private-only VMs, run Ansible from a host with private routing to these IPs,
#   or use IAP tunneling/ProxyCommand.
# - If using IAP, configure ansible_ssh_common_args per host/group.
# - Replace placeholder IPs with the real Terraform output before first deploy.
