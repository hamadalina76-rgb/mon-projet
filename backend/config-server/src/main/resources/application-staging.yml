# ============================================================================
# CONFIGURATION STAGING - CONFIG SERVER SPEEDLINE
# ============================================================================
# Configuration pour pré-production

server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8

spring:
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
  security:
    user:
      name: ${CONFIG_USER:config-staging}
      password: ${CONFIG_PASSWORD:config-staging}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://eureka:eureka123@eureka:8761/eureka/}
    registry-fetch-interval-seconds: 30
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${random.value}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}

  endpoints:
    web:
      exposure:
        include: health,info,refresh,configprops
      base-path: /actuator

  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: WARN
    org.springframework: INFO
    org.springframework.cloud.config: INFO
    org.springframework.security: INFO
    com.speedline: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/config-server.log

