# ============================================================================
# CONFIG SERVER — application-dev.yml (DEV / Cloud Run)
# ============================================================================
# ✅ FIX: évite "Invalid config server configuration"
# Pourquoi ça crashait ?
# - Cloud Run lance souvent seulement avec profile=dev
# - Si profile "native" n'est PAS actif, Config Server suppose mode GIT
# - Sans spring.cloud.config.server.git.uri => crash
#
# ✅ Solution :
# - Forcer le backend "native" via "spring.cloud.config.server.native"
# - Et désactiver explicitement "git" en DEV (pas de git.uri)
# ============================================================================

server:
  port: ${PORT:8080}
  address: 0.0.0.0

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:config-server}

  # Basic Auth (optionnel)
  security:
    user:
      name: ${CONFIG_USER:config}
      password: ${CONFIG_PASSWORD:config123}

# ----------------------------------------------------------------------------
# Eureka (optionnel)
# ----------------------------------------------------------------------------
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: ${EUREKA_ENABLED:false}
    fetch-registry: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:}
  instance:
    prefer-ip-address: true

# ----------------------------------------------------------------------------
# Actuator
# ----------------------------------------------------------------------------
management:
  server:
    port: ${PORT:8080}

  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,refresh,configprops

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework.cloud.config: INFO
    org.springframework.security: INFO