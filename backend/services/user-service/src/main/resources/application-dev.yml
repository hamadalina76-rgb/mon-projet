# ============================================================================
# USER-SERVICE - application-dev.yml (Cloud Run DEV)
# AlignÃ© sur le pattern auth-service pour un dÃ©ploiement Terraform + Cloud Run.
# ============================================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: user-service

  main:
    lazy-initialization: true  # âœ… RÃ©duit le cold start

  # Cloud SQL via postgres-socket-factory (env injectÃ©es par Terraform)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_users}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history_user_v2
    validate-on-migrate: false

  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# File Upload Configuration
file:
  upload:
    dir: ${UPLOAD_DIR:uploads/profile-pictures}
    base-url: ${UPLOAD_BASE_URL:http://localhost:8082/uploads}
    max-file-size: 5MB
    max-request-size: 5MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.speedline: DEBUG

