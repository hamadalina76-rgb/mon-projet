# ============================================================================
# AUTH-SERVICE - application-dev.yml (Cloud Run DEV)
# Surcharge application.yml pour l environnement DEV.
# Sur Cloud Run, la config est injectée via variables d'environnement Terraform.
# spring-cloud-starter-bootstrap et spring-cloud-starter-config sont SUPPRIMÉS
# du classpath pom.xml => pas de Bootstrap Context => pas de crash JPA.
#
# Envoi d'emails (OTP) : définir MAIL_USERNAME et MAIL_PASSWORD (env ou
# application-dev.local.yml à la racine du module, fichier non committé).
# Voir env.example.
# ============================================================================
spring:
  config:
    import: optional:file:./application-dev.local.yml

---
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: auth-service

  # Datasource Cloud SQL via postgres-socket-factory (connecteur JDBC GCP pur)
  # URL format: jdbc:postgresql:///DB_NAME?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
  # Credentials: authentification ADC automatique via Service Account Cloud Run.
  # IMPORTANT: spring-cloud-gcp-autoconfigure est EXCLU du fat JAR (scope provided).
  # => CloudSqlEnvironmentPostProcessor ne s'exécute JAMAIS => pas de crash "database name".
  # => La connexion passe par socketFactory explicite dans l'URL JDBC.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_auth}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000
      timeout: 2000

  # Désactiver Config Client et Bootstrap (sécurité - déjà supprimés du classpath)
  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false

  mail:
    host: ${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
    port: ${SPRING_MAIL_PORT:${MAIL_PORT:587}}
    username: ${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
    password: ${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:15000}
          timeout: ${MAIL_TIMEOUT:15000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:15000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:speedline-super-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:dev-placeholder}
    client-secret: ${GOOGLE_CLIENT_SECRET:dev-placeholder}
  facebook:
    app-id: ${FACEBOOK_APP_ID:dev-placeholder}
    app-secret: ${FACEBOOK_APP_SECRET:dev-placeholder}

frontend:
  url: ${FRONTEND_URL:http://localhost:4300}

otp:
  expiration:
    minutes: ${OTP_EXPIRATION_MINUTES:3}

# Désactive le health check mail en dev si MAIL_USERNAME/MAIL_PASSWORD non configurés (évite "no password specified").
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.speedline: DEBUG
