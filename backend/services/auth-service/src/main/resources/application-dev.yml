# ============================================================================
# AUTH-SERVICE - application-dev.yml (Cloud Run DEV)
# Surcharge application.yml pour l environnement DEV.
# Sur Cloud Run, la config est injectÃ©e via variables d'environnement Terraform.
# spring-cloud-starter-bootstrap et spring-cloud-starter-config sont SUPPRIMÃ‰S
# du classpath pom.xml => pas de Bootstrap Context => pas de crash JPA.
#
# Envoi d'emails (OTP) : dÃ©finir MAIL_USERNAME et MAIL_PASSWORD (env ou
# application-dev.local.yml Ã  la racine du module, fichier non committÃ©).
# Voir env.example.
# ============================================================================
spring:
  config:
    import: optional:file:./application-dev.local.yml

---
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: auth-service

  main:
    lazy-initialization: true  # âœ… RÃ©duit le cold start

  # Datasource Cloud SQL via postgres-socket-factory (connecteur JDBC GCP pur)
  # URL format: jdbc:postgresql:///DB_NAME?cloudSqlInstance=PROJECT:REGION:INSTANCE&socketFactory=com.google.cloud.sql.postgres.SocketFactory
  # Credentials: authentification ADC automatique via Service Account Cloud Run.
  # IMPORTANT: spring-cloud-gcp-autoconfigure est EXCLU du fat JAR (scope provided).
  # => CloudSqlEnvironmentPostProcessor ne s'exÃ©cute JAMAIS => pas de crash "database name".
  # => La connexion passe par socketFactory explicite dans l'URL JDBC.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_auth}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:${SPRING_DATA_REDIS_HOST:localhost}}
      port: ${REDIS_PORT:${SPRING_DATA_REDIS_PORT:6379}}
      password: ${REDIS_PASSWORD:}
      connect-timeout: 2000
      timeout: 2000

  # DÃ©sactiver Config Client et Bootstrap (sÃ©curitÃ© - dÃ©jÃ  supprimÃ©s du classpath)
  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false
    openfeign:
      client:
        config:
          user-service:
            url: ${USER_SERVICE_URL:https://user-service-392205979525.europe-west1.run.app}
          partner-service:
            url: ${PARTNER_SERVICE_URL:https://partner-service-392205979525.europe-west1.run.app}

  # Email Configuration (OTP, bienvenue partenaire)
  # Port 465 (SSL) : souvent autorisÃ© quand le port 587 est bloquÃ©. Pour 587/STARTTLS : MAIL_PORT=587, MAIL_USE_465=false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: devwisetunisie@gmail.com
    password: owiq ixkt efgl wkte
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          starttls:
            enable: false
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:15000}
          timeout: ${MAIL_TIMEOUT:15000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:15000}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:speedline-super-secret-key-for-jwt-token-generation-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:dev-placeholder}
    client-secret: ${GOOGLE_CLIENT_SECRET:dev-placeholder}
  facebook:
    app-id: ${FACEBOOK_APP_ID:dev-placeholder}
    app-secret: ${FACEBOOK_APP_SECRET:dev-placeholder}

frontend:
  url: ${FRONTEND_URL:http://localhost:4300}

uploads:
  base-url: ${UPLOADS_BASE_URL:https://storage.googleapis.com/${FILE_GCS_BUCKET}}

otp:
  expiration:
    minutes: ${OTP_EXPIRATION_MINUTES:3}

# DÃ©sactive le health check mail en dev si MAIL_USERNAME/MAIL_PASSWORD non configurÃ©s (Ã©vite "no password specified").
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.speedline: DEBUG
