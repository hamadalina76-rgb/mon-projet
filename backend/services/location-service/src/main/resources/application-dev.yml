# ============================================================================
# LOCATION-SERVICE - application-dev.yml (Cloud Run DEV)
# AlignÃ© sur le pattern auth-service pour un dÃ©ploiement Terraform + Cloud Run.
# ============================================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: location-service

  main:
    lazy-initialization: true  # âœ… RÃ©duit le cold start

  # Le service utilise Spring Cache + Redis en DEV Cloud.
  # Le mode local continue de passer par application.yml (localhost / Docker Compose).
  cache:
    type: redis

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_locations}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history_location
    validate-on-migrate: false
    ignore-missing-migrations: true

  data:
    redis:
      # En Cloud Run DEV, Redis doit être injecté par Terraform/Memorystore.
      # Aucune valeur localhost n'est autorisée ici.
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.speedline: DEBUG
