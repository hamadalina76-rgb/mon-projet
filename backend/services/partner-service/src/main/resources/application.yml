server:
  port: 8083
  tomcat:
    max-http-post-size: 10MB
    max-swallow-size: 10MB

spring:
  application:
    name: partner-service
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB
  cache:
    type: redis
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_partners
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway gère les migrations, Hibernate valide seulement
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    gcp:
      project-id: ${GCP_PROJECT_ID:speedline-local}
      sql:
        enabled: false
        database-name: speedline_partners
      # ═══════════════════════════════════════════════════════════════════════════
      # Pub/Sub Configuration (Local Developer Environment)
      # ═══════════════════════════════════════════════════════════════════════════
      # This is the DEFAULT configuration for local development ONLY.
      # 
      # LOCAL MODE (application.yml - no profile):
      #   - Pub/Sub EMULATOR: localhost:8090
      #   - Project: speedline-local
      #   - Topics/subscriptions: Created automatically by PubSubConfig.java
      #   - Credentials: None required (emulator mode)
      #   - Startup: Run `docker-compose up -d pubsub-emulator` first
      #
      # To run locally:
      #   1. Start Docker Compose: `docker-compose up -d pubsub-emulator`
      #   2. Run service with default profile (no -Dspring.profiles.active):
      #      `mvn spring-boot:run`
      #   3. Check startup logs for PubSubStartupLogger banner
      #
      # DEVELOPMENT MODE (application-dev.yml - profile: dev):
      #   - Uses REAL GCP Pub/Sub (no emulator)
      #   - application-dev.yml overrides emulator-host to "" (empty)
      #   - Project: speedline-dev
      #   - Credentials: Workload Identity on Cloud Run
      #   - Topics/subscriptions: Managed by Terraform
      #   - Bootstrap: Disabled (Terraform manages infrastructure)
      #
      # NOTE: application-dev.yml MUST have emulator-host set to "" (blank).
      #       This ensures ANY presence of PUBSUB_EMULATOR_HOST env var is ignored.
      # ═══════════════════════════════════════════════════════════════════════════
      pubsub:
        enabled: true
        # Local developer default: connect to Docker Compose emulator
        # If PUBSUB_EMULATOR_HOST env var is set, it overrides localhost:8090
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8090}

# File storage configuration
file:
  upload-dir: ./uploads
  base-url: http://localhost:8083/uploads

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/

# SpringDoc OpenAPI / Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

nearby:
  default-radius-km: 5.0

feign:
  client:
    user-service:
      url: http://localhost:8082
    order-service:
      url: http://localhost:8084
