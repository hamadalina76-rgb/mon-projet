# ============================================================================
# PARTNER-SERVICE - application-dev.yml (Cloud Run DEV)
# AlignÃ© sur le pattern auth-service tout en conservant Pub/Sub.
# ============================================================================
server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: partner-service

  main:
    lazy-initialization: true  # âœ… RÃ©duit le cold start

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_partners}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      initialization-fail-timeout: 0

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    table: flyway_schema_history
    validate-on-migrate: false

  cloud:
    config:
      enabled: false
    bootstrap:
      enabled: false
    openfeign:
      client:
        config:
          # Feign direct Cloud Run URL â€” Eureka est dÃ©sactivÃ© en DEV.
          # Sans cette URL, createPartnerFromAuth ne peut pas appeler auth-service
          # pour mettre Ã  jour user.partnerId (PUT /internal/users/{id}/partner-id).
          auth-service:
            url: ${AUTH_SERVICE_URL:https://auth-service-392205979525.europe-west1.run.app}
    gcp:
      project-id: ${GCP_PROJECT_ID:speedline-dev-488413}
      credentials:
        enabled: true
      sql:
        enabled: false
      core:
        enabled: true
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      # Pub/Sub Configuration - CLOUD RUN DEV ENVIRONMENT
      # 
      # Override application.yml completely for cloud deployment:
      # 1. emulator-host MUST be "" (empty) to force real GCP Pub/Sub
      # 2. Uses Workload Identity for credentials (no explicit config needed)
      # 3. Topics/subscriptions managed by Terraform (not bootstrapped here)
      # 4. PubSubConfig.java detects empty emulator-host and skips bootstrap
      # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
      pubsub:
        enabled: true
        # CRITICAL FIX: Must explicitly override the base application.yml which defaults to
        # emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8090}
        # Without this override, Cloud Run DEV resolves emulator-host to "localhost:8090"
        # (because PUBSUB_EMULATOR_HOST is not set on Cloud Run) and ALL publishes silently
        # fail trying to connect to a non-existent local emulator.
        # Empty string = real GCP Pub/Sub via Workload Identity / ADC.
        emulator-host: ${PUBSUB_EMULATOR_HOST:}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

file:
  upload-dir: ${UPLOAD_DIR:/tmp/uploads}
  base-url: ${UPLOAD_BASE_URL:http://localhost:8083/uploads}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.speedline: DEBUG

