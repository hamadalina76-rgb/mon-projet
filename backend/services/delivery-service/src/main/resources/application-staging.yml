spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:5432/speedline_delivery_staging
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      pubsub:
        subscriber:
          parallel-pull-count: 2
          max-outstanding-element-count: 100
    pubsub:
      project-id: ${GCP_PROJECT_ID}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: WARN
    org.springframework: INFO
    org.springframework.web: INFO
    com.speedline: INFO
    com.speedline.delivery: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/delivery-service.log

