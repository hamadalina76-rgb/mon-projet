server:
  port: 8085

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_delivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway gère les migrations, Hibernate valide seulement
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    gcp:
      project-id: ${GCP_PROJECT_ID:speedline-local}
      sql:
        enabled: ${SPRING_CLOUD_GCP_SQL_ENABLED:false}
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8090}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

# DISP-101: dispatch loop configuration
dispatch:
  interval-seconds: ${DISPATCH_INTERVAL_SECONDS:5}
  scheduler:
    pool-size: ${DISPATCH_POOL_SIZE:4}
  events:
    topic: ${DISPATCH_EVENTS_TOPIC:dispatch-events}
  order-events:
    subscription: ${DISPATCH_ORDER_EVENTS_SUB:order-events-delivery-sub}
  lock:
    ttl-seconds: 30
  pending:
    ttl-hours: 24
  enricher:
    default-zone-id: ${DISPATCH_ENRICHER_DEFAULT_ZONE_ID:1}
    default-guaranteed-delivery-minutes: ${DISPATCH_ENRICHER_DEFAULT_GUARANTEED_DELIVERY_MINUTES:30}
  zones:
    - id: 1
      mode: AUTO
      max-capacity: 50
    - id: 2
      mode: AUTO
      max-capacity: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: delivery-service
