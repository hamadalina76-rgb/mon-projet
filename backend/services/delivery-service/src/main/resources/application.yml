server:
  port: 8085

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_delivery
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway gère les migrations, Hibernate valide seulement
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    gcp:
      project-id: ${GCP_PROJECT_ID:speedline-local}
      sql:
        enabled: ${SPRING_CLOUD_GCP_SQL_ENABLED:false}
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8090}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
    instances:
      orToolsSolver:
        baseConfig: default
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
    instances:
      orToolsSolver:
        maxAttempts: 2
        waitDuration: 200ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s
    instances:
      orToolsSolver:
        timeoutDuration: 2s
        cancelRunningFuture: true

# DISP-101: dispatch loop configuration
dispatch:
  interval-seconds: ${DISPATCH_INTERVAL_SECONDS:5}
  scheduler:
    pool-size: ${DISPATCH_POOL_SIZE:4}
  events:
    topic: ${DISPATCH_EVENTS_TOPIC:dispatch-events}
  order-events:
    subscription: ${DISPATCH_ORDER_EVENTS_SUB:order-events-delivery-sub}
  lock:
    ttl-seconds: 30
  pending:
    ttl-hours: 24
  enricher:
    default-zone-id: ${DISPATCH_ENRICHER_DEFAULT_ZONE_ID:1}
    default-guaranteed-delivery-minutes: ${DISPATCH_ENRICHER_DEFAULT_GUARANTEED_DELIVERY_MINUTES:30}
  solver:
    greedy-max-orders: ${DISPATCH_SOLVER_GREEDY_MAX_ORDERS:5}
    hungarian-max-orders: ${DISPATCH_SOLVER_HUNGARIAN_MAX_ORDERS:10}
    inf-cost-placeholder: ${DISPATCH_SOLVER_INF_COST_PLACEHOLDER:1000000000000.0}
    ortools:
      url: ${DISPATCH_SOLVER_ORTOOLS_URL:http://localhost:5001}
      timeout-ms: ${DISPATCH_SOLVER_ORTOOLS_TIMEOUT_MS:2000}
      enabled: ${DISPATCH_SOLVER_ORTOOLS_ENABLED:true}
  eligibility:
    order-waiting-threshold-seconds: ${DISPATCH_ELIG_WAITING_SECONDS:180}
    internal-shortage-threshold: ${DISPATCH_ELIG_SHORTAGE:2}
  pre-assignment:
    finish-window-seconds: ${DISPATCH_PREASSIGN_WINDOW_SECONDS:180}
    cost-penalty: ${DISPATCH_PREASSIGN_PENALTY:1.2}
  refusal:
    internal-warning-threshold: ${DISPATCH_REFUSAL_INTERNAL_WARN:2}
    internal-hr-threshold: ${DISPATCH_REFUSAL_INTERNAL_HR:3}
    external-score-degradation-threshold: ${DISPATCH_REFUSAL_EXTERNAL_SCORE:5}
    counter-ttl-hours: 24
    blacklist-ttl-seconds: 300
  response-timeout:
    deadline-seconds: ${DISPATCH_RESPONSE_TIMEOUT_SECONDS:45}
    poll-interval-ms: 5000
  inactivity:
    scheduler-interval-seconds: 60
    threshold-minutes: ${DISPATCH_INACTIVITY_THRESHOLD_MIN:15}
  courier-response:
    refusal-subscription: ${DISPATCH_COURIER_REFUSED_SUB:courier-order-refused-delivery-sub}
  delivery-incident:
    subscription: ${DISPATCH_DELIVERY_INCIDENT_SUB:delivery-incident-delivery-sub}
  partner-delay:
    subscription: ${DISPATCH_PARTNER_NOT_READY_SUB:partner-not-ready-delivery-sub}
    scheduler-interval-seconds: ${DISPATCH_PARTNER_DELAY_SCHEDULER_SECONDS:15}
    threshold-minutes: ${DISPATCH_PARTNER_DELAY_THRESHOLD_MINUTES:5}
  admin-alerts:
    topic: ${DISPATCH_ADMIN_ALERTS_TOPIC:admin-alerts}
    hr-topic: ${DISPATCH_HR_NOTIFICATIONS_TOPIC:hr-notifications}
    reliability-topic: ${DISPATCH_RELIABILITY_EVENTS_TOPIC:courier-reliability-events}
  zones:
    - id: 1
      mode: AUTO
      max-capacity: 50
    - id: 2
      mode: AUTO
      max-capacity: 50

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: delivery-service
