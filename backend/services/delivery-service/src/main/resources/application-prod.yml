spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/speedline_delivery
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  flyway:
    baseline-on-migrate: false

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID}
      pubsub:
        subscriber:
          parallel-pull-count: 4
          max-outstanding-element-count: 200
    pubsub:
      project-id: ${GCP_PROJECT_ID}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER}:${EUREKA_PASSWORD}@eureka:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: ERROR
    org.springframework: WARN
    org.springframework.web: WARN
    com.speedline: WARN
    com.speedline.delivery: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/delivery-service.log

