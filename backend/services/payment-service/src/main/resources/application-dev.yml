server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    encoding:
      charset: UTF-8

spring:
  application:
    name: payment-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_payment}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

  flyway:
    baseline-on-migrate: true

  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:speedline-dev}
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8085}
        subscriber:
          parallel-pull-count: 1
          max-outstanding-element-count: 100
    pubsub:
      project-id: ${GCP_PROJECT_ID:speedline-dev}

eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    org.springframework: DEBUG
    org.springframework.web: DEBUG
    com.speedline: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

  file:
    name: logs/payment-service.log

