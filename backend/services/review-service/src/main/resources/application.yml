server:
  port: 8091

spring:
  application:
    name: review-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:mongo}:${MONGO_PASSWORD:mongo123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/speedline_reviews?authSource=admin
      database: speedline_reviews
      auto-index-creation: true # Crée automatiquement les index définis dans les @Document

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
