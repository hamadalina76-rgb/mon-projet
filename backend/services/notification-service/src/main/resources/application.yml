server:
  port: 8087

spring:
  application:
    name: notification-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USERNAME:mongo}:${MONGO_PASSWORD:mongo123}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/speedline_notifications?authSource=admin
      database: speedline_notifications
      auto-index-creation: true # Crée automatiquement les index définis dans les @Document
  cloud:
    gcp:
      project-id: ${GCP_PROJECT_ID:speedline-local}
      # Désactive l'essai de charger Application Default Credentials localement
      # (évite IOException au démarrage — l'émulateur n'a pas besoin de credentials)
      credentials:
        enabled: ${GCP_CREDENTIALS_ENABLED:false}
      # ═══════════════════════════════════════════════════════════════════════════
      # Pub/Sub Configuration (Local Developer Environment)
      # ═══════════════════════════════════════════════════════════════════════════
      # This is the DEFAULT configuration for local development ONLY.
      # 
      # LOCAL MODE (application.yml - no profile):
      #   - Pub/Sub EMULATOR: localhost:8090
      #   - Project: speedline-local
      #   - Topics/subscriptions: Created automatically by PubSubConfig.java
      #   - Credentials: None required (emulator mode)
      #   - Startup: Run `docker-compose up -d pubsub-emulator` first
      #
      # To run locally:
      #   1. Start Docker Compose: `docker-compose up -d pubsub-emulator`
      #   2. Run service with default profile (no -Dspring.profiles.active):
      #      `mvn spring-boot:run`
      #   3. Check startup logs for PubSubStartupLogger banner
      #
      # DEVELOPMENT MODE (application-dev.yml - profile: dev):
      #   - Uses REAL GCP Pub/Sub (no emulator)
      #   - application-dev.yml overrides emulator-host to "" (empty)
      #   - Project: speedline-dev
      #   - Credentials: Workload Identity on Cloud Run
      #   - Topics/subscriptions: Managed by Terraform
      #   - Bootstrap: Disabled (Terraform manages infrastructure)
      #
      # NOTE: application-dev.yml MUST have emulator-host set to "" (blank).
      #       This ensures ANY presence of PUBSUB_EMULATOR_HOST env var is ignored.
      # ═══════════════════════════════════════════════════════════════════════════
      pubsub:
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8090}
        subscriber:
          parallel-pull-count: 1
          max-ack-extension-period: 600
  thymeleaf:
    check-template-location: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:devwisetunisie@gmail.com}
    password: ${MAIL_PASSWORD:owiq ixkt efgl wkte}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
          connectiontimeout: 30000
          timeout: 30000
          writetimeout: 30000

# Firebase FCM: chemin vers le JSON du compte de service.
# Fichier dans src/main/resources/credeentials/speedline-b5dba-firebase-adminsdk-fbsvc-d6ee146810.json
# Préfixe classpath: = chargement depuis les resources (fonctionne en IDE et en JAR).
firebase:
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:classpath:credeentials/speedline-b5dba-firebase-adminsdk-fbsvc-d6ee146810.json}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
