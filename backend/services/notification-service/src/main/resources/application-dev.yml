server:
  # --------------------------------------------------------------------------
  # Cloud Run impose l'utilisation du port fourni dans la variable PORT.
  # Si PORT n'est pas dÃ©fini (exÃ©cution locale), on utilise 8080 par dÃ©faut.
  # --------------------------------------------------------------------------
  port: ${PORT:8080}

  # --------------------------------------------------------------------------
  # TrÃ¨s important pour Cloud Run :
  # l'application doit Ã©couter sur 0.0.0.0 et non pas seulement localhost.
  # --------------------------------------------------------------------------
  address: 0.0.0.0

spring:
  application:
    # Nom du microservice dans l'Ã©cosystÃ¨me Spring / logs / observabilitÃ©
    name: notification-service

  main:
    lazy-initialization: false

  data:
    mongodb:
      # ----------------------------------------------------------------------
      # URI MongoDB :
      # - En prioritÃ© on lit MONGODB_URI (nom injectÃ© actuellement par Terraform)
      # - Sinon on retombe sur MONGO_URI (ancien nom possible dans GitLab CI/CD)
      #
      # Cela Ã©vite les crashes au dÃ©marrage dus Ã  une incohÃ©rence de nom
      # entre les variables Cloud Run / Terraform / GitLab.
      # ----------------------------------------------------------------------
      uri: ${MONGODB_URI:${MONGO_URI}}

      # ----------------------------------------------------------------------
      # CrÃ©ation automatique des index Mongo dÃ©finis dans les entitÃ©s/documents.
      # Utile en DEV pour Ã©viter certaines initialisations manuelles.
      # ----------------------------------------------------------------------
      auto-index-creation: true

  cloud:
    config:
      # ----------------------------------------------------------------------
      # DÃ©sactivation explicite du Config Client en DEV.
      # Le service ne va pas essayer d'aller chercher sa config depuis
      # un Config Server au dÃ©marrage.
