      pubsub:
        # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        # Pub/Sub Configuration - CLOUD RUN DEV ENVIRONMENT
        # 
        # Override application.yml completely for cloud deployment:
        # 1. emulator-host MUST be "" (empty) to force real GCP Pub/Sub
        # 2. Uses Workload Identity for credentials (no explicit config needed)
        # 3. Topics/subscriptions managed by Terraform (not bootstrapped here)
        # 4. PubSubConfig.java detects empty emulator-host and skips bootstrap
        # â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
        # CRITICAL: Empty string prevents any local emulator fallback
        emulator-host: ${PUBSUB_EMULATOR_HOST:}

        # Subscriber parameters for dev
        subscriber:
          parallel-pull-count: 1
          max-ack-extension-period: 600

  # Email Configuration (OTP, bienvenue partenaire)
  # Port 465 (SSL) : souvent autorisÃ© quand le port 587 est bloquÃ©. Pour 587/STARTTLS : MAIL_PORT=587, MAIL_USE_465=false
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: devwisetunisie@gmail.com
    password: owiq ixkt efgl wkte
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          starttls:
            enable: false
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:15000}
          timeout: ${MAIL_TIMEOUT:15000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:15000}

eureka:
  client:
    # --------------------------------------------------------------------------
    # Eureka dÃ©sactivÃ© par dÃ©faut en DEV.
    # Si besoin, activer via EUREKA_ENABLED=true.
    # --------------------------------------------------------------------------
    enabled: ${EUREKA_ENABLED:false}

    service-url:
      # ------------------------------------------------------------------------
      # URL par dÃ©faut de Eureka pour compatibilitÃ© locale.
