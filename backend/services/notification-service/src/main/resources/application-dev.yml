      enabled: false

    bootstrap:
      # ----------------------------------------------------------------------
      # DÃ©sactivation du bootstrap context pour Ã©viter le chargement prÃ©coce
      # de configurations distantes ou de comportements Spring Cloud inutiles
      # en environnement DEV / Cloud Run.
      # ----------------------------------------------------------------------
      enabled: false

    gcp:
      # ----------------------------------------------------------------------
      # ID du projet GCP :
      # - si GCP_PROJECT_ID est injectÃ©, il sera utilisÃ©
      # - sinon fallback sur "speedline-dev"
      # ----------------------------------------------------------------------
      project-id: ${GCP_PROJECT_ID:speedline-dev-488413}
      credentials:
        enabled: true

      core:
        # ----------------------------------------------------------------------
        # Laisser activÃ© si le service utilise rÃ©ellement des composants GCP
        # standards dans ce microservice.
        # ----------------------------------------------------------------------
