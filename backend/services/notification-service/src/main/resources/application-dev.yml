management:
  endpoints:
    web:
      # ------------------------------------------------------------------------
      # Point d'entrÃ©e actuator.
      # TrÃ¨s utile pour health checks, debug et supervision.
      # ------------------------------------------------------------------------
      base-path: /actuator

      exposure:
        # ----------------------------------------------------------------------
        # Endpoints exposÃ©s en DEV.
