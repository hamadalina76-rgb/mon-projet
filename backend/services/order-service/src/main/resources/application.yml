server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/speedline_orders
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate # Flyway gère les migrations, Hibernate valide seulement
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    gcp:
      # Même modèle que partner-service : topic order-events → notification-service (WebSocket)
      project-id: ${GCP_PROJECT_ID:speedline-local}
      # Local + émulateur : pas d'Application Default Credentials (évite l'erreur IOException au démarrage)
      credentials:
        enabled: ${GCP_CREDENTIALS_ENABLED:false}
      pubsub:
        enabled: ${GCP_PUBSUB_ENABLED:true}
        emulator-host: ${PUBSUB_EMULATOR_HOST:localhost:8090}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_USER:eureka}:${EUREKA_PASSWORD:eureka123}@localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    hostname: localhost

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

cart:
  redis:
    # Configurable cart TTL in hours. Effective value is clamped between 24h and 72h.
    ttl-hours: ${CART_REDIS_TTL_HOURS:24}

order:
  events:
    topic: ${ORDER_EVENTS_TOPIC:order-events}
