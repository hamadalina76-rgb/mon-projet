server:
  port: 8080
  netty:
    max-initial-line-length: 8192

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Auth Service (includes admin auth endpoints)
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        # User Service - Public app-status endpoint (no auth required for mobile apps)
        - id: user-service-app-status
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/settings/app-status
          filters:
            - StripPrefix=1

        # User Service - Public working-hours endpoint (no auth required for mobile apps)
        - id: user-service-working-hours-public
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admin/settings/working-hours/public
          filters:
            - StripPrefix=1

        # User Service (includes admin management endpoints)
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/admins/**, /api/v1/admin-roles/**, /api/v1/admin/activity-logs/**, /api/v1/admin/customers/**, /api/v1/admin/couriers/**, /api/v1/admin/schedule-templates/**, /api/v1/admin/exceptional-schedules/**, /api/v1/admin/settings/**, /api/users/**, /api/customers/**, /api/couriers/**, /api/addresses/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - RoleAuthorizationFilter
            - name: CircuitBreaker
              args:
                name: userServiceBreaker
                fallbackUri: forward:/fallback/user

        # User Service - Direct courier endpoints (without /api prefix)
        - id: user-service-couriers-direct
          uri: lb://user-service
          predicates:
            - Path=/couriers/**, /v1/courier/schedule/**
          filters:
            - AuthenticationFilter

        # User Service - Uploads (profile pictures)
        - id: user-service-uploads
          uri: lb://user-service
          predicates:
            - Path=/uploads/profile-pictures/**

        # Partner Service - Uploads (logos, covers, category images)
        - id: partner-service-uploads
          uri: lb://partner-service
          predicates:
            - Path=/uploads/partners/**, /uploads/categories/**

        # Partner Service
        - id: partner-service
          uri: lb://partner-service
          predicates:
            - Path=/api/partners/**, /api/products/**, /api/v1/categories/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - RoleAuthorizationFilter
            - name: CircuitBreaker
              args:
                name: partnerServiceBreaker
                fallbackUri: forward:/fallback/partner

        # Partner Service - Favorites (/api/favorites/** -> /partners/favorites/**)
        - id: partner-service-favorites
          uri: lb://partner-service
          predicates:
            - Path=/api/favorites, /api/favorites/**
          filters:
            - AuthenticationFilter
            - RoleAuthorizationFilter
            - StripPrefix=1
            - PrefixPath=/partners

        # Partner Service - Admin Endpoints
        - id: partner-service-admin
          uri: lb://partner-service
          predicates:
            - Path=/api/v1/admin/partners/**, /api/v1/admin/products/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter
            - RoleAuthorizationFilter

        # Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: orderServiceBreaker
                fallbackUri: forward:/fallback/order

        # Cart endpoints (backed by order-service)
        - id: order-service-cart
          uri: lb://order-service
          predicates:
            - Path=/api/cart, /api/cart/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: orderServiceBreaker
                fallbackUri: forward:/fallback/order

        # Delivery Service
        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/api/deliveries/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: deliveryServiceBreaker
                fallbackUri: forward:/fallback/delivery

        # Delivery Service - Direct endpoints (without /api prefix)
        - id: delivery-service-direct
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**
          filters:
            - AuthenticationFilter

        # Delivery Service - WebSocket (tracking courier position)
        - id: delivery-service-ws
          uri: lb:ws://delivery-service
          predicates:
            - Path=/ws/location,/ws/tracking/**

        # Delivery Service - REST tracking (position from Redis)
        - id: delivery-service-tracking
          uri: lb://delivery-service
          predicates:
            - Path=/api/v1/tracking/**,/api/v1/docs/tracking-websocket
          filters:
            - AuthenticationFilter

        # Payment Service
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**, /api/wallets/**, /api/payment-methods/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: paymentServiceBreaker
                fallbackUri: forward:/fallback/payment

        # Notification Service
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**, /api/push-tokens/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceBreaker
                fallbackUri: forward:/fallback/notification

        # Notification Service (v1 API - admin/partner panels)
        - id: notification-service-v1
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: notificationServiceBreaker
                fallbackUri: forward:/fallback/notification

        # Notification Service - WebSocket
        - id: notification-service-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/notifications/**

        # Location Service
        - id: location-service
          uri: lb://location-service
          predicates:
            - Path=/api/locations/**, /api/zones/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: locationServiceBreaker
                fallbackUri: forward:/fallback/location

        # Analytics Service
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/analytics/**, /api/reports/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: analyticsServiceBreaker
                fallbackUri: forward:/fallback/analytics

        # Promotion Service
        - id: promotion-service
          uri: lb://promotion-service
          predicates:
            - Path=/api/promotions/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: promotionServiceBreaker
                fallbackUri: forward:/fallback/promotion

        # Promotion Service (v1 API - admin panel)
        - id: promotion-service-v1
          uri: lb://promotion-service
          predicates:
            - Path=/api/v1/promotions/**
          filters:
            - StripPrefix=2
            - AuthenticationFilter
            - RoleAuthorizationFilter
            - name: CircuitBreaker
              args:
                name: promotionServiceBreaker
                fallbackUri: forward:/fallback/promotion

        # Review Service
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**, /api/ratings/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: reviewServiceBreaker
                fallbackUri: forward:/fallback/review

        # Support Service
        - id: support-service
          uri: lb://support-service
          predicates:
            - Path=/api/tickets/**, /api/faq/**
          filters:
            - StripPrefix=1
            - AuthenticationFilter

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms

eureka:
  client:
    service-url:
      defaultZone: http://eureka:eureka123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:speedline-super-secret-key-for-jwt-token-generation-minimum-256-bits}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
  timelimiter:
    configs:
      default:
        timeoutDuration: 5s

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
