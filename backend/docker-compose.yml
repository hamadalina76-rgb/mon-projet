# Docker Compose pour SpeedLine - Infrastructure uniquement
# Les microservices sont lances localement avec Maven

services:
  # ==================== DATABASES ====================

  # PostgreSQL - Main Database
  postgres:
    image: postgis/postgis:15-3.3
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres123}
      - POSTGRES_MULTIPLE_DATABASES=speedline_auth,speedline_users,speedline_partners,speedline_orders,speedline_delivery,speedline_payments,speedline_locations,speedline_promotions,speedline_support
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - speedline-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB - Notifications & Reviews
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongo
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongo123}
    volumes:
      - mongodb_data:/data/db
    networks:
      - speedline-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Caching & Rate Limiting
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - speedline-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ClickHouse - Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-click123}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - speedline-network

  # ==================== MESSAGE BROKER ====================

  # GCP Pub/Sub Emulator - Local Development
  pubsub-emulator:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    container_name: pubsub-emulator
    ports:
      - "8090:8090"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8090 --project=speedline-local
    networks:
      - speedline-network

# ==================== NETWORKS ====================
networks:
  speedline-network:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  clickhouse_data:
