name: customer_app
description: "SpeedLine Customer Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.0.0
  
  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  # retrofit: ^4.0.3
  
  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  location: ^5.0.3
  geocoding: ^2.1.1
  flutter_polyline_points: ^2.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  
  # UI Components
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  dotted_border: ^2.1.0
  
  # Firebase (temporairement commenté pour éviter erreurs de compilation web)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  # firebase_analytics: ^10.8.0
  # firebase_crashlytics: ^3.4.9
  # firebase_auth: ^4.16.0
  
  # Payment
  flutter_stripe: ^10.1.0
  
  # Social Authentication
  google_sign_in: ^6.2.1
  flutter_facebook_auth: ^7.0.1
  
  # Utilities
  intl: ^0.20.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  logger: ^2.0.2
  flutter_dotenv: ^5.1.0
  connectivity_plus: ^5.0.2
  permission_handler: ^11.1.0
  # awesome_notifications: ^0.8.2
  flutter_local_notifications: ^20.0.0
  flutter_screenutil: ^5.9.0
  flutter_svg: ^2.0.9
  
  # WebSocket
  web_socket_channel: ^2.4.0
  
  # Image Picker
  image_picker: ^1.0.4
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Animations
  lottie: ^2.7.0
  responsive_framework: ^1.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  # retrofit_generator: ^8.0.4
  drift_dev: ^2.14.1
  
  # Testing
  mockito: ^5.4.4
  flutter_lints: ^3.0.1
  
  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/speedline_logo.png
    - assets/images/free-delivery.png

    - assets/icons/expedition-rapide.png
    - assets/icons/restaurant.png
    - assets/icons/panier-de-courses.png
    - assets/icons/promotion.png
    
    - assets/icons/google_logo.png
    - assets/animations/
    - .env.development
    - .env.staging
    - .env.production

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/speedline_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/speedline_logo.png"
