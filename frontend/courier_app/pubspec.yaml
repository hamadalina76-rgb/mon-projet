name: courier_app
description: Courier delivery application - SpeedLine Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # STATE MANAGEMENT
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  
  # NETWORKING
  dio: ^5.4.0
  retrofit: ^4.0.3
  web_socket_channel: ^3.0.3
  connectivity_plus: ^7.0.0
  
  # STORAGE
  drift: ^2.14.1
  drift_flutter: ^0.2.8
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # LOCATION & MAPS
  geolocator: ^14.0.2
  google_maps_flutter: ^2.5.3
  flutter_polyline_points: ^3.1.0
  geocoding: ^4.0.0
  location: ^8.0.1
  
  # NAVIGATION
  go_router: ^17.0.1
  
  # FIREBASE
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7
  firebase_remote_config: ^6.1.4
  firebase_performance: ^0.11.1+4
  firebase_auth: ^6.1.4
  
  # NOTIFICATIONS
  flutter_local_notifications: ^19.5.0
  # awesome_notifications: ^0.8.2
  
  # PERMISSIONS
  permission_handler: ^12.0.1
  
  # IMAGE & CAMERA
  image_picker: ^1.0.5
  image_cropper: ^11.0.0
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.1
  
  # SIGNATURE
  signature: ^6.3.0
  
  # UI/UX
  flutter_screenutil: ^5.9.0
  shimmer: ^3.0.0
  lottie: ^3.3.2
  flutter_svg: ^2.0.9
  smooth_page_indicator: ^2.0.1
  flutter_slidable: ^4.0.3
  pull_to_refresh: ^2.0.0
  
  # UTILITIES
  intl: ^0.20.0
  timeago: ^3.6.0
  url_launcher: ^6.2.2
  share_plus: ^12.0.1
  path_provider: ^2.1.1
  flutter_dotenv: ^6.0.0
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  uuid: ^4.2.2
  
  # DEPENDENCY INJECTION
  get_it: ^9.2.0
  injectable: ^2.3.2
  
  # BACKGROUND TASKS
  workmanager: ^0.9.0+3
  flutter_background_service: ^5.0.5
  
  # AUDIO
  just_audio: ^0.10.5
  audioplayers: ^6.5.1
  
  # LOGGING & DEBUGGING
  logger: ^2.0.2+1
  flutter_native_splash: ^2.3.9
  
  # CHARTS
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^32.1.24
  
  # WEBRTC
  flutter_webrtc: ^1.2.1
  
  # DEEP LINKS
  app_links: ^6.3.4
  
  # TESTING
  mockito: ^5.4.4
  build_runner: ^2.4.7
  
  cupertino_icons: ^1.0.8
  
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^6.0.0
  
  # CODE GENERATION
  riverpod_generator: ^4.0.0+1
  retrofit_generator: ^10.2.1
  json_serializable: ^6.7.1
  drift_dev: ^2.14.1
  injectable_generator: ^2.4.1
  
  # TESTING
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4

# Icône et nom de l'app (notifications, launcher) = SpeedLine
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/speedline_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/speedline_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  
  assets:
    - assets/config/
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/sounds/
    - .env.development
    - .env.staging
    - .env.production
  
