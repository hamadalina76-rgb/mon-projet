<!-- Order Actions Component Template - Angular 19 -->
<div class="order-actions">
  <button mat-icon-button [matMenuTriggerFor]="actionsMenu">
    <mat-icon>more_vert</mat-icon>
  </button>

  <mat-menu #actionsMenu="matMenu">
    <button mat-menu-item (click)="print.emit()">
      <mat-icon>print</mat-icon>
      <span>{{ 'ORDERS.ACTIONS.PRINT' | translate }}</span>
    </button>
    @if (isPending()) {
      <button mat-menu-item (click)="cancel.emit()">
        <mat-icon>cancel</mat-icon>
        <span>{{ 'ORDERS.ACTIONS.REJECT' | translate }}</span>
      </button>
    }
  </mat-menu>

  @if (isPending()) {
    <button mat-flat-button color="primary" (click)="confirm.emit()">
      {{ 'ORDERS.ACTIONS.ACCEPT' | translate }}
    </button>
  }

  @if (isConfirmed()) {
    <button mat-flat-button color="primary" (click)="startPreparing.emit()">
      {{ 'ORDERS.ACTIONS.PREPARE' | translate }}
    </button>
  }

  @if (isPreparing()) {
    <button mat-flat-button color="primary" (click)="markReady.emit()">
      {{ 'ORDERS.ACTIONS.READY' | translate }}
    </button>
  }
</div>
