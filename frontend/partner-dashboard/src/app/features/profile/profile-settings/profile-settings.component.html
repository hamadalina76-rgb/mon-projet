<!-- Profile Settings Component Template - Angular 19 -->
<div class="profile-settings-page">
  <header class="page-header">
    <h1>{{ 'profile.settings' | translate }}</h1>
  </header>

  @if (loading()) {
    <div class="loading-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <div class="settings-grid">
      <!-- Personal Info -->
      <mat-card class="settings-card">
        <h3>Informations personnelles</h3>
        <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
          <div class="form-row">
            <mat-form-field appearance="outline">
              <mat-label>Prénom</mat-label>
              <input matInput formControlName="firstName" />
            </mat-form-field>

            <mat-form-field appearance="outline">
              <mat-label>Nom</mat-label>
              <input matInput formControlName="lastName" />
            </mat-form-field>
          </div>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" />
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Téléphone</mat-label>
            <input matInput formControlName="phone" />
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" [disabled]="saving()">
            @if (saving()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Enregistrer
            }
          </button>
        </form>
      </mat-card>

      <!-- Change Password -->
      <mat-card class="settings-card">
        <h3>Changer le mot de passe</h3>
        <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Mot de passe actuel</mat-label>
            <input matInput [type]="hideCurrentPassword() ? 'password' : 'text'" formControlName="currentPassword" />
            <button mat-icon-button matSuffix type="button" (click)="hideCurrentPassword.set(!hideCurrentPassword())">
              <mat-icon>{{ hideCurrentPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Nouveau mot de passe</mat-label>
            <input matInput [type]="hideNewPassword() ? 'password' : 'text'" formControlName="newPassword" />
            <button mat-icon-button matSuffix type="button" (click)="hideNewPassword.set(!hideNewPassword())">
              <mat-icon>{{ hideNewPassword() ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Confirmer le mot de passe</mat-label>
            <input matInput [type]="hideNewPassword() ? 'password' : 'text'" formControlName="confirmPassword" />
          </mat-form-field>

          <button mat-flat-button color="primary" type="submit" [disabled]="changingPassword()">
            @if (changingPassword()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Changer mot de passe
            }
          </button>
        </form>
      </mat-card>
    </div>
  }
</div>
