<!-- Product Card Component Template - Angular 19 -->
<div class="product-card" [class.unavailable]="!isAvailable()">
  <!-- Image section -->
  <div class="product-image">
    <img [src]="productImageSrc()"
         [alt]="product().name"
         (error)="onImageError($event)" />
    <div class="image-overlay">
      <button class="overlay-btn edit-btn" (click)="onEdit()" [matTooltip]="'MENU.PRODUCT_CARD.TOOLTIP_EDIT' | translate">
        <mat-icon>edit</mat-icon>
      </button>
      <button class="overlay-btn delete-btn" (click)="onDelete()" [matTooltip]="'MENU.PRODUCT_CARD.TOOLTIP_DELETE' | translate">
        <mat-icon>delete_outline</mat-icon>
      </button>
    </div>
    @if (!isAvailable()) {
      <div class="status-badge unavailable-badge">
        <mat-icon>block</mat-icon>
        {{ 'MENU.PRODUCT_CARD.BADGE_UNAVAILABLE' | translate }}
      </div>
    }
    @if (product().isPopular) {
      <div class="status-badge popular-badge">
        <mat-icon>local_fire_department</mat-icon>
        {{ 'MENU.PRODUCT_CARD.BADGE_POPULAR' | translate }}
      </div>
    }
  </div>

  <!-- Content section -->
  <div class="product-body">
    <div class="product-info">
      <h4 class="product-name">{{ product().name }}</h4>
      @if (product().description) {
        <p class="product-description">{{ product().description }}</p>
      }
    </div>

    <div class="product-footer">
      <div class="product-price">{{ priceFormatted() }}</div>
      <div class="product-controls">
        <mat-slide-toggle
          [checked]="isAvailable()"
          (change)="onToggleAvailability()"
          [matTooltip]="isAvailable() ? ('MENU.PRODUCT_CARD.TOOLTIP_DISABLE' | translate) : ('MENU.PRODUCT_CARD.TOOLTIP_ENABLE' | translate)">
        </mat-slide-toggle>
      </div>
    </div>
  </div>
</div>
