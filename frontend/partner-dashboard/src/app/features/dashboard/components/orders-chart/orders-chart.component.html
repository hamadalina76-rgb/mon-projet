<!-- Orders Chart Component Template - Angular 19 -->
<div class="chart-container">
  @if (loading()) {
    <div class="loading-overlay">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }
  <canvas baseChart
    [type]="chartType"
    [data]="chartData()"
    [options]="chartOptions">
  </canvas>
</div>
