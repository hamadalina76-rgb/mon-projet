<!-- FAQ Manager Component Template -->
<div class="faq-manager-page">
  <header class="page-header">
    <h1>{{ 'support.faq' | translate }}</h1>
    <div class="header-actions">
      <button mat-flat-button color="primary" (click)="openCreateDialog()">
        <mat-icon>add</mat-icon>
        Nouvelle question
      </button>
    </div>
  </header>

  <!-- FAQ List -->
  <mat-card class="faq-card">
    <mat-accordion>
      <mat-expansion-panel *ngFor="let faq of faqs">
        <mat-expansion-panel-header>
          <mat-panel-title>{{ faq.question }}</mat-panel-title>
        </mat-expansion-panel-header>
        <div class="faq-content">
          <p>{{ faq.answer }}</p>
          <div class="faq-actions">
            <button mat-icon-button (click)="editFAQ(faq)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteFAQ(faq.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </mat-expansion-panel>
    </mat-accordion>
  </mat-card>
</div>
