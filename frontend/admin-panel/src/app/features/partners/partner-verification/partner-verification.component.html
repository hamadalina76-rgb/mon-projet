<!-- Partner Verification Component Template -->
<div class="partner-verification-page">
  <header class="page-header">
    <div class="header-left">
      <button mat-icon-button routerLink="/partners">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1>{{ 'partners.verification.title' | translate }}</h1>
    </div>
  </header>

  <div class="verification-content" *ngIf="partner">
    <!-- Documents list -->
    <mat-card class="documents-card" *ngFor="let doc of documents">
      <div class="document-item">
        <div class="document-info">
          <mat-icon>description</mat-icon>
          <div>
            <h4>{{ doc.type }}</h4>
            <span class="document-date">{{ 'partners.verification.submittedOn' | translate }} {{ doc.submittedAt | date }}</span>
          </div>
        </div>
        <div class="document-actions">
          <button mat-icon-button (click)="viewDocument(doc)">
            <mat-icon>visibility</mat-icon>
          </button>
          <mat-checkbox [(ngModel)]="doc.verified">{{ 'partners.verification.verified' | translate }}</mat-checkbox>
        </div>
      </div>
    </mat-card>

    <!-- Actions -->
    <div class="actions-bar">
      <button mat-flat-button color="primary" (click)="saveVerification()">
        {{ 'common.save' | translate }}
      </button>
    </div>
  </div>
</div>
