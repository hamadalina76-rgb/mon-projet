<!-- Disputes Component Template -->
<div class="disputes-page">
  <header class="page-header">
    <div class="header-left">
      <button mat-icon-button routerLink="/orders">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1>Litiges et réclamations</h1>
    </div>
  </header>

  <!-- Stats -->
  <div class="stats-row">
    <!-- Dispute stats -->
  </div>

  <!-- Tabs -->
  <mat-card class="content-card">
    <mat-tab-group>
      <mat-tab label="En attente">
        <app-data-table
          [data]="disputes"
          [loading]="loading">
        </app-data-table>
      </mat-tab>
      <mat-tab label="En cours de traitement">
        <!-- Processing disputes -->
      </mat-tab>
      <mat-tab label="Résolus">
        <!-- Resolved disputes -->
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
