<!-- Permissions Manager Component Template -->
<div class="permissions-manager">
  <mat-accordion>
    <!-- Users permissions -->
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Utilisateurs</mat-panel-title>
      </mat-expansion-panel-header>
      <div class="permission-group">
        <mat-checkbox>Voir les utilisateurs</mat-checkbox>
        <mat-checkbox>Modifier les utilisateurs</mat-checkbox>
        <mat-checkbox>Bloquer les utilisateurs</mat-checkbox>
      </div>
    </mat-expansion-panel>

    <!-- Partners permissions -->
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Partenaires</mat-panel-title>
      </mat-expansion-panel-header>
      <div class="permission-group">
        <mat-checkbox>Voir les partenaires</mat-checkbox>
        <mat-checkbox>Approuver les partenaires</mat-checkbox>
        <mat-checkbox>Modifier les partenaires</mat-checkbox>
      </div>
    </mat-expansion-panel>

    <!-- Orders permissions -->
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title>Commandes</mat-panel-title>
      </mat-expansion-panel-header>
      <div class="permission-group">
        <mat-checkbox>Voir les commandes</mat-checkbox>
        <mat-checkbox>Gérer les litiges</mat-checkbox>
      </div>
    </mat-expansion-panel>

    <!-- More permission groups... -->
  </mat-accordion>
</div>
