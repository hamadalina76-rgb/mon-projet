<!-- Courier Detail Component Template -->
<div class="courier-detail-page">
  <header class="page-header">
    <div class="header-left">
      <button mat-icon-button routerLink="/users/couriers">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h1>Détails du livreur</h1>
    </div>
    <div class="header-actions">
      <!-- Action buttons -->
    </div>
  </header>

  <div class="courier-content" *ngIf="courier">
    <!-- Courier info card -->
    <mat-card class="info-card">
      <!-- Courier information -->
    </mat-card>

    <!-- Tabs -->
    <mat-card class="tabs-card">
      <mat-tab-group>
        <mat-tab label="Livraisons">
          <!-- Deliveries list -->
        </mat-tab>
        <mat-tab label="Documents">
          <!-- Documents list -->
        </mat-tab>
        <mat-tab label="Performance">
          <!-- Performance metrics -->
        </mat-tab>
        <mat-tab label="Paiements">
          <!-- Payment history -->
        </mat-tab>
      </mat-tab-group>
    </mat-card>
  </div>
</div>
