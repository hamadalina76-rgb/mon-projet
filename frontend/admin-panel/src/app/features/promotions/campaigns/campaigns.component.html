<!-- Campaigns Component Template -->
<div class="campaigns-page">
  <header class="page-header">
    <h1>{{ 'promotions.campaigns' | translate }}</h1>
    <div class="header-actions">
      <button mat-flat-button color="primary" routerLink="new">
        <mat-icon>add</mat-icon>
        Nouvelle campagne
      </button>
    </div>
  </header>

  <!-- Campaigns Grid -->
  <div class="campaigns-grid">
    <mat-card *ngFor="let campaign of campaigns" class="campaign-card">
      <div class="campaign-header">
        <h3>{{ campaign.name }}</h3>
        <span class="campaign-status" [ngClass]="campaign.status">{{ campaign.status }}</span>
      </div>
      <div class="campaign-info">
        <span>{{ campaign.startDate | date }} - {{ campaign.endDate | date }}</span>
        <span>{{ campaign.usageCount }} utilisations</span>
      </div>
      <div class="campaign-actions">
        <button mat-icon-button [routerLink]="[campaign.id]">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteCampaign(campaign.id)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </mat-card>
  </div>
</div>
