<div class="form-page">

  <!-- Back link -->
  <a class="back-link" (click)="back()">
    <span class="material-icons-round">arrow_back</span>
    {{ 'promotions.title' | translate }}
  </a>

  <!-- Centered title + subtitle -->
  <div class="form-hero">
    <h1>{{ title }}</h1>
    <p>{{ subtitle }}</p>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="full-loader">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <!-- Custom stepper header -->
  <nav *ngIf="!loading" class="stepper-nav">
    <ng-container *ngFor="let step of stepMeta; let i = index; let last = last">
      <button class="step-indicator"
              [class.step-indicator--active]="currentStep === i"
              [class.step-indicator--done]="currentStep > i"
              (click)="goToStep(i)">
        <span class="step-circle">
          <mat-icon *ngIf="currentStep > i" class="done-icon">check</mat-icon>
          <span *ngIf="currentStep <= i">{{ i + 1 }}</span>
        </span>
        <span class="step-label">{{ step.label | translate }}</span>
      </button>
      <span *ngIf="!last" class="step-connector"
            [class.step-connector--done]="currentStep > i"></span>
    </ng-container>
  </nav>

  <!-- Stepper (header hidden, only content) -->
  <mat-stepper *ngIf="!loading" #stepper linear class="promo-stepper" labelPosition="bottom"
               (selectionChange)="currentStep = $event.selectedIndex">

    <!-- Step 1 -->
    <mat-step [stepControl]="stepGeneralGroup"
              [hasError]="stepGeneralGroup.invalid && stepGeneralGroup.touched">

      <div class="step-card">
        <app-step-general
          [formGroup]="stepGeneralGroup"
          [isEdit]="isEdit">
        </app-step-general>
      </div>

      <div class="step-actions">
        <span></span>
        <button mat-flat-button matStepperNext color="primary" class="btn-next"
                (click)="validateStep(stepGeneralGroup, 'promotions.form.step1Title')">
          {{ 'promotions.form.next' | translate }}
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <!-- Step 2 -->
    <mat-step [stepControl]="stepConditionsGroup">

      <div class="step-card">
        <app-step-conditions
          [formGroup]="stepConditionsGroup">
        </app-step-conditions>
      </div>

      <div class="step-actions">
        <button mat-stroked-button matStepperPrevious class="btn-prev">
          <mat-icon>arrow_back</mat-icon>
          {{ 'promotions.form.previous' | translate }}
        </button>
        <button mat-flat-button matStepperNext color="primary" class="btn-next"
                (click)="validateStep(stepConditionsGroup, 'promotions.form.step2Title')">
          {{ 'promotions.form.next' | translate }}
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <!-- Step 3 -->
    <mat-step [stepControl]="stepTargetingGroup" [optional]="true">

      <div class="step-card">
        <app-step-targeting
          [formGroup]="stepTargetingGroup"
          [promotionType]="promotionType"
          [rulesArray]="rulesArray"
          (partnersLoaded)="onPartnersLoaded($event)"
          (categoriesLoaded)="onCategoriesLoaded($event)"
          (zonesLoaded)="onZonesLoaded($event)">
        </app-step-targeting>
      </div>

      <div class="step-actions">
        <button mat-stroked-button matStepperPrevious class="btn-prev">
          <mat-icon>arrow_back</mat-icon>
          {{ 'promotions.form.previous' | translate }}
        </button>
        <button mat-flat-button matStepperNext color="primary" class="btn-next">
          {{ 'promotions.form.next' | translate }}
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <!-- Step 4 -->
    <mat-step>

      <div class="step-card">
        <app-step-summary
          [form]="form"
          [isEdit]="isEdit"
          [saving]="saving"
          [partners]="partners"
          [categories]="categories"
          [zones]="zones"
          (submitActive)="submitForm()">
        </app-step-summary>
      </div>

      <div class="step-actions step-actions--back-only">
        <button mat-stroked-button matStepperPrevious class="btn-prev">
          <mat-icon>arrow_back</mat-icon>
          {{ 'promotions.form.previous' | translate }}
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
