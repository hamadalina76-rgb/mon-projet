<div class="form-page">

  <!-- Back button + title -->
  <div class="form-header">
    <button mat-icon-button (click)="back()" class="back-btn" [matTooltip]="'promotions.form.back' | translate">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <div>
      <h1>{{ title }}</h1>
      <p class="subtitle">{{ subtitle }}</p>
    </div>
  </div>

  <!-- Loading state -->
  <div *ngIf="loading" class="full-loader">
    <mat-spinner diameter="48"></mat-spinner>
  </div>

  <!-- Stepper -->
  <mat-stepper *ngIf="!loading" #stepper linear class="promo-stepper" labelPosition="bottom">

    <!-- â•â•â• Ã‰tape 1 â€” Informations gÃ©nÃ©rales â•â•â• -->
    <mat-step [stepControl]="stepGeneralGroup"
              [label]="'promotions.form.step1Title' | translate"
              [hasError]="stepGeneralGroup.invalid && stepGeneralGroup.touched">
      <ng-template matStepLabel>
        <mat-icon>badge</mat-icon>
        {{ 'promotions.form.step1Title' | translate }}
      </ng-template>

      <app-step-general
        [formGroup]="stepGeneralGroup"
        [isEdit]="isEdit">
      </app-step-general>

      <div class="step-actions">
        <span></span>
        <button mat-flat-button matStepperNext color="primary" class="btn-next"
                (click)="validateStep(stepGeneralGroup, 'promotions.form.step1Title')">
          {{ 'promotions.form.next' | translate }}
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <!-- â•â•â• Ã‰tape 2 â€” Conditions & Limites â•â•â• -->
    <mat-step [stepControl]="stepConditionsGroup"
              [label]="'promotions.form.step2Title' | translate">
      <ng-template matStepLabel>
        <mat-icon>tune</mat-icon>
        {{ 'promotions.form.step2Title' | translate }}
      </ng-template>

      <app-step-conditions
        [formGroup]="stepConditionsGroup">
      </app-step-conditions>

      <div class="step-actions">
        <button mat-stroked-button matStepperPrevious class="btn-prev">
          <mat-icon>arrow_back</mat-icon>
          {{ 'promotions.form.previous' | translate }}
        </button>
        <button mat-flat-button matStepperNext color="primary" class="btn-next"
                (click)="validateStep(stepConditionsGroup, 'promotions.form.step2Title')">
          {{ 'promotions.form.next' | translate }}
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <!-- â•â•â• Ã‰tape 3 â€” Ciblage â•â•â• -->
    <mat-step [stepControl]="stepTargetingGroup"
              [label]="'promotions.form.step3Title' | translate"
              [optional]="true">
      <ng-template matStepLabel>
        <mat-icon>filter_alt</mat-icon>
        {{ 'promotions.form.step3Title' | translate }}
      </ng-template>

      <app-step-targeting
        [formGroup]="stepTargetingGroup"
        [promotionType]="promotionType"
        [rulesArray]="rulesArray"
        (partnersLoaded)="onPartnersLoaded($event)"
        (categoriesLoaded)="onCategoriesLoaded($event)"
        (zonesLoaded)="onZonesLoaded($event)">
      </app-step-targeting>

      <div class="step-actions">
        <button mat-stroked-button matStepperPrevious class="btn-prev">
          <mat-icon>arrow_back</mat-icon>
          {{ 'promotions.form.previous' | translate }}
        </button>
        <button mat-flat-button matStepperNext color="primary" class="btn-next">
          {{ 'promotions.form.next' | translate }}
          <mat-icon iconPositionEnd>arrow_forward</mat-icon>
        </button>
      </div>
    </mat-step>

    <!-- â•â•â• Ã‰tape 4 â€” RÃ©capitulatif â•â•â• -->
    <mat-step [label]="'promotions.form.step4Title' | translate">
      <ng-template matStepLabel>
        <mat-icon>check_circle</mat-icon>
        {{ 'promotions.form.step4Title' | translate }}
      </ng-template>

      <app-step-summary
        [form]="form"
        [isEdit]="isEdit"
        [saving]="saving"
        [partners]="partners"
        [categories]="categories"
        [zones]="zones"
        (submitDraft)="submitAsDraft()"
        (submitActive)="submitAsActive()">
      </app-step-summary>

      <div class="step-actions step-actions--back-only">
        <button mat-stroked-button matStepperPrevious class="btn-prev">
          <mat-icon>arrow_back</mat-icon>
          {{ 'promotions.form.previous' | translate }}
        </button>
      </div>
    </mat-step>
  </mat-stepper>
</div>
