<!-- Performance Analytics Component Template -->
<div class="performance-analytics-page">
  <header class="page-header">
    <h1>{{ 'analytics.performance' | translate }}</h1>
  </header>

  <!-- KPIs -->
  <div class="kpis-grid">
    <mat-card class="kpi-card">
      <div class="kpi-icon">
        <mat-icon>timer</mat-icon>
      </div>
      <div class="kpi-content">
        <span class="kpi-value">28 min</span>
        <span class="kpi-label">Temps de livraison moyen</span>
      </div>
    </mat-card>

    <mat-card class="kpi-card">
      <div class="kpi-icon">
        <mat-icon>star</mat-icon>
      </div>
      <div class="kpi-content">
        <span class="kpi-value">4.6</span>
        <span class="kpi-label">Note moyenne</span>
      </div>
    </mat-card>

    <mat-card class="kpi-card">
      <div class="kpi-icon">
        <mat-icon>check_circle</mat-icon>
      </div>
      <div class="kpi-content">
        <span class="kpi-value">98.5%</span>
        <span class="kpi-label">Taux de complétion</span>
      </div>
    </mat-card>

    <mat-card class="kpi-card">
      <div class="kpi-icon">
        <mat-icon>cancel</mat-icon>
      </div>
      <div class="kpi-content">
        <span class="kpi-value">1.2%</span>
        <span class="kpi-label">Taux d'annulation</span>
      </div>
    </mat-card>
  </div>

  <!-- Charts -->
  <div class="charts-grid">
    <mat-card class="chart-card">
      <h3>Temps de livraison par heure</h3>
      <div class="chart-container">
        <!-- Chart here -->
      </div>
    </mat-card>

    <mat-card class="chart-card">
      <h3>Performance par zone</h3>
      <div class="chart-container">
        <!-- Chart here -->
      </div>
    </mat-card>
  </div>
</div>
