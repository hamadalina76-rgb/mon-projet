<!-- Sidebar -->
<aside class="sidebar" [class.mobile-open]="mobileOpen" [class.collapsed]="collapsed">
  <!-- Overlay for mobile -->
  @if (mobileOpen) {
    <div class="sidebar-overlay" (click)="closeMobile.emit()"></div>
  }

  <div class="sidebar-inner" [class.collapsed]="collapsed">
    <!-- Bouton replier/ouvrir -->
    <button
      type="button"
      class="btn-toggle-sidebar"
      (click)="onToggle()"
      [attr.aria-label]="(collapsed ? 'nav.expandSidebar' : 'nav.collapseSidebar') | translate"
      [matTooltip]="(collapsed ? 'nav.expandSidebar' : 'nav.collapseSidebar') | translate"
    >
      <span class="material-icons-round">{{ collapsed ? chevronExpand() : chevronCollapse() }}</span>
    </button>

    <!-- Logo -->
    <div class="sidebar-header">
      <img src="assets/image/speedLineLogo.png" alt="SpeedLine" class="logo" />
      <span class="brand-name">SpeedLine</span>
    </div>

    <!-- Navigation -->
    <nav class="sidebar-nav">
      @for (section of sections; track section) {
        <div class="nav-section">
          <p class="section-label">{{ section | translate }}</p>
          @for (item of getItemsBySection(section); track item.label) {
            @if (!item.permission || hasPermission(item.permission)) {
              <a
                class="nav-item"
                [routerLink]="item.route"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
                (click)="onNavClick()"
              >
                <span class="material-icons-round nav-icon">{{ item.icon }}</span>
                <span class="nav-label">{{ item.label | translate }}</span>
              </a>
            }
          }
        </div>
      }
    </nav>

    <!-- Footer: Theme Toggle -->
    <div class="sidebar-footer">
      <button class="theme-btn" (click)="toggleTheme()">
        <span class="material-icons-round">{{ themeService.isDarkMode() ? 'light_mode' : 'dark_mode' }}</span>
        <span class="theme-label">{{ 'common.appearance' | translate }}</span>
      </button>
    </div>
  </div>
</aside>
