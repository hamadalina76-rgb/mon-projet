# ==============================================================================
# TERRAFORM DEV GÉNÉRAL
# ==============================================================================
# Règle importante :
# - Si un changement data-services est présent, on NE lance PAS terraform_apply_dev
#   pour éviter un double apply concurrent sur le même environnement DEV.
# - Donc, en cas de commit mixte (infra générale + data-services), priorité au flux
#   data-services. Il vaut mieux séparer ces commits si possible.
# ==============================================================================
terraform_apply_dev:
  stage: terraform_apply
  image: google/cloud-sdk:slim
  tags:
    - terraform
  interruptible: true
  resource_group: terraform-dev
  needs:
    - job: build_delivery_service
      artifacts: true
      optional: true
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "//iam.googleapis.com/${WIF_PROVIDER}"
  before_script:
    - !reference [.gcp_auth_wif, before_script]
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
    - unzip -o /tmp/terraform.zip -d /usr/local/bin
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/wif_cred.json
  rules:
    # --------------------------------------------------------------------------
    # PRIORITÉ AU FLUX DATA-SERVICES POUR ÉVITER LES CONFLITS
    # --------------------------------------------------------------------------
    - if: '$CI_COMMIT_BRANCH == "devops-devlop-add-env-staging-1"'
      changes: *changes_data_services_infra
      when: never
    - if: '$CI_COMMIT_TAG =~ /^dev-.*$/'
      changes: *changes_data_services_infra
      when: never
    - if: '$CI_COMMIT_TAG =~ /^infra-.*$/'
      changes: *changes_data_services_infra
      when: never

    # --------------------------------------------------------------------------
    # INFRA DEV GÉNÉRALE
    # --------------------------------------------------------------------------
    - if: '$CI_COMMIT_BRANCH == "devops-devlop-add-env-staging-1"'
      changes: *changes_general_dev_infra
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^dev-.*$/'
      changes: *changes_general_dev_infra
      when: on_success
    - if: '$CI_COMMIT_TAG =~ /^infra-.*$/'
      changes: *changes_general_dev_infra
      when: on_success
    - when: never
  script:
    - |
      set -euo pipefail

      cd "$TF_DIR"

      # ------------------------------------------------------------------------
      # Préparer l'URI Git du Config Server
      # ------------------------------------------------------------------------
      RAW_CONFIG_SERVER_GIT_URI="${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:-${CONFIG_SERVER_GIT_URI:-${CONFIG_GIT_URI:-${GIT_REPO_URI:-}}}}"
      if echo "$RAW_CONFIG_SERVER_GIT_URI" | grep -q '/-/tree/'; then
        TF_VAR_config_server_git_uri="${RAW_CONFIG_SERVER_GIT_URI%%/-/tree/*}.git"
      else
        TF_VAR_config_server_git_uri="$RAW_CONFIG_SERVER_GIT_URI"
      fi
      export TF_VAR_config_server_git_uri

      if [ -z "$TF_VAR_config_server_git_uri" ]; then
        echo "ERROR: Missing config_server_git_uri"
        exit 1
      fi

      # ------------------------------------------------------------------------
      # Préparer l'URI MongoDB
      # ------------------------------------------------------------------------
      EFFECTIVE_MONGODB_URI="${MONGODB_URI:-${MONGO_URI:-}}"
      if [ -z "$EFFECTIVE_MONGODB_URI" ]; then
        echo "ERROR: Missing mongodb_uri"
        exit 1
      fi
      export TF_VAR_mongodb_uri="$EFFECTIVE_MONGODB_URI"

      # ------------------------------------------------------------------------
      # Variables Atlas optionnelles
      # ------------------------------------------------------------------------
      export TF_VAR_atlas_public_key="${ATLAS_PUBLIC_KEY:-}"
      export TF_VAR_atlas_private_key="${ATLAS_PRIVATE_KEY:-}"
      export TF_VAR_atlas_project_id="${ATLAS_PROJECT_ID:-}"

      # ------------------------------------------------------------------------
      # IAM projet désactivé dans le flux standard
      # ------------------------------------------------------------------------
      export TF_VAR_enable_project_iam_bindings="false"

      # ------------------------------------------------------------------------
      # Terraform init / validate
      # ------------------------------------------------------------------------
      terraform init -input=false
      terraform validate

      # ------------------------------------------------------------------------
      # Gestion de l'image delivery-service pour le bootstrap Terraform
      # ------------------------------------------------------------------------
      DELIVERY_TF_IMAGE_URI=""
      DELIVERY_SERVICE_EXISTS="false"

      if gcloud run services describe "delivery-service" \
        --region "$GCP_REGION" \
        --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
        DELIVERY_SERVICE_EXISTS="true"
      fi

      if [ "${SERVICE_NAME:-}" = "delivery-service" ] && [ -n "${IMAGE_URI:-}" ]; then
        echo "Using delivery-service image from current job environment."
        DELIVERY_TF_IMAGE_URI="$IMAGE_URI"
      elif [ -f "$CI_PROJECT_DIR/delivery-service.env" ]; then
        echo "Using delivery-service image from build artifact."
        unset SERVICE_NAME IMAGE_URI
        . "$CI_PROJECT_DIR/delivery-service.env"
        if [ -n "${SERVICE_NAME:-}" ] && [ -n "${IMAGE_URI:-}" ]; then
          DELIVERY_TF_IMAGE_URI="$IMAGE_URI"
        fi
      elif [ "$DELIVERY_SERVICE_EXISTS" = "true" ]; then
        echo "Using current Cloud Run image for delivery-service bootstrap."
        DELIVERY_TF_IMAGE_URI="$(gcloud run services describe "delivery-service" \
          --region "$GCP_REGION" \
          --project "$GCP_PROJECT_ID" \
          --format='value(spec.template.containers[0].image)')"
      fi

      if [ -n "$DELIVERY_TF_IMAGE_URI" ]; then
        echo "Injecting built delivery-service image into Terraform image map..."
        jq --arg service "delivery-service" --arg image "$DELIVERY_TF_IMAGE_URI" \
          '.images[$service] = $image' \
          images.auto.tfvars.json > /tmp/images.auto.tfvars.json
        mv /tmp/images.auto.tfvars.json images.auto.tfvars.json
      elif [ "$DELIVERY_SERVICE_EXISTS" != "true" ]; then
        echo "ERROR: delivery-service requires a built image before Terraform can create Cloud Run."
        echo "Run build_delivery_service first so Terraform can use a real Artifact Registry image."
        exit 1
      fi

      # ------------------------------------------------------------------------
      # Import éventuel du service delivery-service dans le state Terraform
      # ------------------------------------------------------------------------
      DELIVERY_TF_ADDR="module.delivery_service.google_cloud_run_v2_service.this"

      if terraform state show "$DELIVERY_TF_ADDR" >/dev/null 2>&1; then
        echo "Skipping import: '$DELIVERY_TF_ADDR' already in state."
      elif gcloud run services describe "delivery-service" \
        --region "$GCP_REGION" \
        --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
        echo "Importing existing Cloud Run service 'delivery-service' into Terraform state..."
        terraform import \
          "$DELIVERY_TF_ADDR" \
          "projects/${GCP_PROJECT_ID}/locations/${GCP_REGION}/services/delivery-service"
      else
        echo "Skipping import: Cloud Run service 'delivery-service' does not exist yet."
      fi

      # ------------------------------------------------------------------------
      # Terraform apply DEV général
      # ------------------------------------------------------------------------
      terraform apply -auto-approve -input=false -lock-timeout=5m

