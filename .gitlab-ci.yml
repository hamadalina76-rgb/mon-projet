# ==============================================================================
# TERRAFORM DEV
# ==============================================================================
# Ce job :
# - ne sert qu'aux changements d'infrastructure
# - ne doit pas partir pour un simple changement backend/frontend
# ==============================================================================
terraform_apply_dev:
  stage: terraform
  image: google/cloud-sdk:slim
  tags:
    - terraform
  interruptible: true
  resource_group: terraform-dev
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "//iam.googleapis.com/${WIF_PROVIDER}"
  before_script:
    - !reference [.gcp_auth_wif, before_script]
    - curl -fsSL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip" -o /tmp/terraform.zip
    - unzip -o /tmp/terraform.zip -d /usr/local/bin
    - export GOOGLE_APPLICATION_CREDENTIALS=/tmp/wif_cred.json
  script:
    - cd "$TF_DIR"

    # --------------------------------------------------------------------------
    # Préparer l'URI Git du Config Server pour Terraform
    # --------------------------------------------------------------------------
    - export RAW_CONFIG_SERVER_GIT_URI="${SPRING_CLOUD_CONFIG_SERVER_GIT_URI:-${CONFIG_SERVER_GIT_URI:-${CONFIG_GIT_URI:-${GIT_REPO_URI:-}}}}"
    - |
      if echo "$RAW_CONFIG_SERVER_GIT_URI" | grep -q '/-/tree/'; then
        TF_VAR_config_server_git_uri="${RAW_CONFIG_SERVER_GIT_URI%%/-/tree/*}.git"
      else
        TF_VAR_config_server_git_uri="$RAW_CONFIG_SERVER_GIT_URI"
      fi
      export TF_VAR_config_server_git_uri

    - |
      if [ -z "$TF_VAR_config_server_git_uri" ]; then
        echo "ERROR: Missing config_server_git_uri"
        exit 1
      fi

    # --------------------------------------------------------------------------
    # Préparer l'URI MongoDB pour Terraform
    # --------------------------------------------------------------------------
    - export EFFECTIVE_MONGODB_URI="${MONGODB_URI:-${MONGO_URI:-}}"
    - |
      if [ -z "$EFFECTIVE_MONGODB_URI" ]; then
        echo "ERROR: Missing mongodb_uri"
        exit 1
      fi
    - export TF_VAR_mongodb_uri="$EFFECTIVE_MONGODB_URI"

    # --------------------------------------------------------------------------
    # Variables optionnelles Mongo Atlas
    # --------------------------------------------------------------------------
    - export TF_VAR_atlas_public_key="${ATLAS_PUBLIC_KEY:-}"
    - export TF_VAR_atlas_private_key="${ATLAS_PRIVATE_KEY:-}"
    - export TF_VAR_atlas_project_id="${ATLAS_PROJECT_ID:-}"

    # --------------------------------------------------------------------------
    # Exécution Terraform
    # --------------------------------------------------------------------------
    - terraform init -input=false
    - terraform validate
    - terraform apply -auto-approve -input=false -lock-timeout=5m

  rules:
    # Un tag infra-* doit lancer Terraform
    - if: '$CI_COMMIT_TAG =~ /^infra-.*$/'

    # Un tag dev-* ne lance Terraform que si infra a changé
    - if: '$CI_COMMIT_TAG =~ /^dev-.*$/'
      changes:
        - infra/**/*

    # Sur la branche ciblée, Terraform ne part que si infra a changé
    - if: '$CI_COMMIT_BRANCH == "develop-add-branch-devlope-lance-pipline"'
      changes:
        - infra/**/*

# ==============================================================================
# STAGING - SQUELETTE MANUEL
# ==============================================================================
build_frontend_staging_images:
  stage: build
  image: google/cloud-sdk:slim
  tags:
    - frontend-docker
  when: manual
  allow_failure: false
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: "//iam.googleapis.com/${WIF_PROVIDER}"
  script:
    - echo "Staging frontend build scaffold ready. Configure staging variables et tags avant activation."
  rules:
    - if: '$CI_COMMIT_TAG =~ /^staging-.*$/'

terraform_apply_staging:
  stage: terraform
  image: google/cloud-sdk:slim
